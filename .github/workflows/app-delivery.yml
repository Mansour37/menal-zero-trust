name: App Delivery

# Chaine de livraison alignee sur les 2 diagrammes du rapport :
#   Phase 1 (PR)   : Portes d'analyse (Gitleaks, Semgrep) + Tests + Build & scan image (Trivy)
#                    -> AUCUNE publication, AUCUN deploiement, AUCUNE auth cloud.
#   Phase 2 (main) : publication au registre + Deploiement PAR DIGEST sha256 (WIF, sans cle)
#                    + smoke test a travers le WAF.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "frontend/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/app-delivery.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "frontend/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/app-delivery.yml"

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
  DASHBOARD_SERVICE_NAME: ${{ vars.DASHBOARD_SERVICE_NAME }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY_URL }}
  BQ_DATASET: ${{ vars.BQ_DATASET }}
  # Fix BLOB_UNKNOWN : la DB Trivy est tiree de ghcr.io (le mirror gcr.io repondait
  # BLOB_UNKNOWN par intermittence).
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # PORTES D'ANALYSE (source) : secrets + SAST
  # ============================================================================
  analyse-secrets-sast:
    name: Portes d'analyse — Gitleaks & Semgrep
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 : gitleaks scanne le range de commits ; semgrep diff-aware
      # a besoin de la baseline (merge-base sur PR / commit precedent sur push).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semgrep/semgrep-action@v1 (deprecie) plantait sur les regles p/default
      # recentes (severite MEDIUM) TOUT EN PASSANT AU VERT (faux-vert). CLI a jour,
      # DIFF-AWARE : bloque les NOUVEAUX findings d'une PR sans rejouer la dette triee.
      - name: Semgrep - SAST
        run: |
          python3 -m pip install --quiet semgrep
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Pas de baseline exploitable -> scan complet informatif (non bloquant)."
            semgrep scan --config p/default --metrics=off || true
          else
            echo "Semgrep diff-aware, baseline=$BASE (bloque uniquement les NOUVEAUX findings)."
            semgrep scan --config p/default --baseline-commit "$BASE" --error --metrics=off
          fi

  # ============================================================================
  # PORTES DE TESTS
  # ============================================================================
  tests-api:
    name: Tests API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-cov httpx   # httpx : requis par fastapi TestClient
      - name: Run API unit tests
        working-directory: api
        run: pytest tests/ -v

  tests-dashboard:
    name: Tests dashboard (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Run dashboard unit tests
        working-directory: dashboard
        run: npm test

  # ============================================================================
  # PORTE D'ANALYSE (image) — API : build + scan Trivy (PR + main),
  # puis publication PAR DIGEST sur main uniquement.
  # ============================================================================
  build-scan-api:
    name: Build & scan image API (Trivy)
    needs: [analyse-secrets-sast, tests-api]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local)
        id: build
        run: |
          IMAGE_LOCAL="menal-api:${{ github.sha }}"
          docker build -t "$IMAGE_LOCAL" ./api
          echo "local=$IMAGE_LOCAL" >> "$GITHUB_OUTPUT"

      # Porte bloquante (PR incluse) : CVE CRITICAL corrigeable => echec. On scanne
      # AVANT tout push (jamais d'image non scannee publiee). ignore-unfixed : pas
      # de blocage sur des CVE sans correctif amont.
      - name: Trivy - CVE Scan (bloquant sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.local }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy - rapport HIGH (informatif)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.local }}
          format: table
          exit-code: 0
          severity: HIGH
          ignore-unfixed: true

      # ---- Phase 2 (main) : publication PAR DIGEST + alimentation SIEM ----
      - id: auth
        name: Authenticate to GCP
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        if: github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Push image + resolve digest (sha256)
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/menal-api:${{ github.sha }}"
          docker tag "${{ steps.build.outputs.local }}" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          echo "Publie par digest : $DIGEST_REF"

      # Boucle F6 : le scan alimente le SIEM (page /siem/vulnerabilities).
      - name: Trivy - rapport JSON pour le SIEM
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.local }}
          format: json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          output: trivy-findings.json

      - name: Charger les CVE dans BigQuery
        if: github.ref == 'refs/heads/main'
        run: |
          pip install --quiet google-cloud-bigquery
          python scripts/load_cve_findings.py \
            --project "${{ env.PROJECT_ID }}" \
            --dataset "${{ env.BQ_DATASET }}" \
            --report trivy-findings.json \
            --image-digest "${{ github.sha }}"

  deploy-api:
    name: Déploiement API (WIF, digest)
    needs: [build-scan-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Deploy to Cloud Run (par digest)
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ needs.build-scan-api.outputs.image }}
          region: ${{ env.REGION }}

      - name: Tag as latest
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/menal-api:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/menal-api:latest || true

      # Smoke test par le domaine REEL : couvre DNS, certificat, LB, Cloud Armor, service.
      - name: Smoke Test (API via LB)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://${{ vars.LB_DOMAIN }}/health || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          case "$HTTP_STATUS" in
            200|302) echo "SUCCESS: service operationnel" ;;
            000)     echo "ECHEC: LB injoignable (DNS/SSL)"; exit 1 ;;
            *)       echo "ECHEC: statut inattendu $HTTP_STATUS"; exit 1 ;;
          esac

  # ============================================================================
  # PORTE D'ANALYSE (image) — Dashboard : build + scan Trivy (PR + main),
  # puis publication PAR DIGEST sur main uniquement.
  # ============================================================================
  build-scan-dashboard:
    name: Build & scan image dashboard (Trivy)
    needs: [analyse-secrets-sast, tests-dashboard]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local)
        id: build
        run: |
          IMAGE_LOCAL="menal-dashboard:${{ github.sha }}"
          docker build -t "$IMAGE_LOCAL" ./dashboard
          echo "local=$IMAGE_LOCAL" >> "$GITHUB_OUTPUT"

      - name: Trivy - CVE Scan (bloquant sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.local }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      # ---- Phase 2 (main) : publication PAR DIGEST ----
      - id: auth
        name: Authenticate to GCP
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        if: github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Push image + resolve digest (sha256)
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/menal-dashboard:${{ github.sha }}"
          docker tag "${{ steps.build.outputs.local }}" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          echo "Publie par digest : $DIGEST_REF"

  deploy-dashboard:
    name: Déploiement dashboard (WIF, digest)
    needs: [build-scan-dashboard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Deploy to Cloud Run (par digest)
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ env.DASHBOARD_SERVICE_NAME }}
          image: ${{ needs.build-scan-dashboard.outputs.image }}
          region: ${{ env.REGION }}

      - name: Tag as latest
        run: |
          gcloud artifacts docker tags add \
            ${{ env.ARTIFACT_REGISTRY }}/menal-dashboard:${{ github.sha }} \
            ${{ env.ARTIFACT_REGISTRY }}/menal-dashboard:latest || true

      - name: Smoke Test (dashboard via LB)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://${{ vars.DASH_DOMAIN }}/login || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          case "$HTTP_STATUS" in
            200|30*) echo "SUCCESS: dashboard operationnel" ;;
            *)       echo "ECHEC: statut inattendu $HTTP_STATUS"; exit 1 ;;
          esac

  # ============================================================================
  # TESTS DE BOUT EN BOUT (apres deploiement)
  # ============================================================================
  e2e:
    name: Tests E2E
    needs: [deploy-api, deploy-dashboard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements-e2e.txt

      - name: Run E2E health & boundary tests
        run: |
          pytest tests/e2e/ -v -x -m "not slow and not gcp" \
            --timeout=30 \
            -o "junit_family=xunit2" \
            --junit-xml=e2e-results.xml
        env:
          E2E_API_URL: https://${{ vars.LB_DOMAIN }}
          # Le dashboard est en ingress LB-only : on le teste via son domaine
          # public (LB + Cloud Armor), pas via l URL .run.app (bloquee par design).
          E2E_DASHBOARD_URL: https://${{ vars.DASH_DOMAIN }}
          E2E_API_RUN_URL: ${{ vars.API_RUN_URL }}
          E2E_ML_EMBED_URL: ${{ vars.ML_EMBED_URL }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results.xml
          retention-days: 7

  e2e-gcp:
    name: Tests E2E (pipeline reel, marques gcp/slow)
    needs: [deploy-api, deploy-dashboard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # continue-on-error : sonde de bout en bout sur trafic reel (BigQuery live),
    # informative, jamais bloquante. T13/T14 pollent 12-20 min et dependent de la
    # cadence des schedulers, pas seulement du code.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements-e2e.txt

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Run E2E pipeline tests (real traffic, real BigQuery)
        run: |
          pytest tests/e2e/ -v -m "gcp" \
            --timeout=1200 \
            -o "junit_family=xunit2" \
            --junit-xml=e2e-gcp-results.xml
        env:
          E2E_API_URL: https://${{ vars.LB_DOMAIN }}
          E2E_DASHBOARD_URL: https://${{ vars.DASH_DOMAIN }}
          E2E_API_RUN_URL: ${{ vars.API_RUN_URL }}
          E2E_ML_EMBED_URL: ${{ vars.ML_EMBED_URL }}
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          BQ_DATASET: ${{ env.BQ_DATASET }}
          E2E_RUN_SLOW: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-gcp-results
          path: e2e-gcp-results.xml
          retention-days: 7
