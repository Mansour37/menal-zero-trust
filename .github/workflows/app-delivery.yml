name: App Delivery

# =============================================================================
# CHAINE DE LIVRAISON APPLICATIVE  —  calquee 1:1 sur le diagramme du rapport
# =============================================================================
# Un job = une boite du diagramme, dans le meme ordre et avec le meme numero :
#
#   1  Authentification federee      (WIF, sans cle)          [phase 2 seule]
#   2  Recherche de secrets          (Gitleaks)        PORTE BLOQUANTE
#   3  Analyse du code               (Semgrep)         PORTE BLOQUANTE
#   4  Tests automatises             (pytest / jest)   PORTE BLOQUANTE
#   5  Construction de l'image       (Docker multi-etape)
#   6  Analyse de l'image            (Trivy)           PORTE BLOQUANTE
#   7  Publication au registre       (empreinte sha256)
#   8  Deploiement et verification   (Cloud Run + sonde par le point d'entree)
#
# Declencheur A — pull_request : etapes 2 a 6.
#   Aucune publication, aucun deploiement, AUCUNE authentification cloud :
#   aucun job de la phase 1 ne detient la permission `id-token`, la chaine est
#   donc techniquement incapable de prendre une identite GCP sur une PR.
#
# Declencheur B — push sur main : etapes 1 a 8.
#
# L'ordre est sequentiel et volontaire (`needs`) : un secret pousse est
# compromis des sa publication, il est donc cherche en premier ; on ne construit
# une image qu'apres avoir valide le code et les tests ; et on ne publie JAMAIS
# une image non scannee — entre l'etape 5 et la porte 6 l'image ne transite
# qu'en artefact interne au run, elle n'existe dans aucun registre.
#
# Une porte rouge ne fait pas qu'echouer : tous les maillons suivants passent en
# `skipped`. La chaine s'arrete, visiblement, exactement comme sur le diagramme.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "frontend/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/app-delivery.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "frontend/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/app-delivery.yml"

# Moindre privilege par defaut : lecture seule. `id-token: write` (federation
# WIF) n'est accorde qu'aux deux jobs de la phase 2 qui en ont besoin.
permissions:
  contents: read

# Une seule chaine en vol par reference. Sur une PR, un nouveau push annule le
# run precedent (inutile) ; sur main, jamais : chaque commit livre doit laisser
# sa trace complete.
concurrency:
  group: app-delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY_URL }}
  BQ_DATASET: ${{ vars.BQ_DATASET }}
  # Fix BLOB_UNKNOWN : la base Trivy est tiree de ghcr.io (le miroir gcr.io
  # repondait BLOB_UNKNOWN par intermittence).
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

jobs:
  # ===========================================================================
  # 2 · PORTE BLOQUANTE — Recherche de secrets
  # ===========================================================================
  secrets:
    name: 2 · Recherche de secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — Gitleaks scanne l'HISTORIQUE COMPLET, pas seulement le
      # dernier commit : un secret introduit puis "retire" reste dans l'objet git.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: gitleaks detect — historique complet
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de commentaire automatique sur la PR : evite d'avoir a elargir
          # le jeton a `pull-requests: write` pour un simple confort d'affichage.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ===========================================================================
  # 3 · PORTE BLOQUANTE — Analyse statique du code
  # ===========================================================================
  sast:
    name: 3 · Analyse du code (Semgrep)
    needs: [secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Semgrep diff-aware a besoin de la baseline (merge-base sur PR,
          # commit precedent sur push).
          fetch-depth: 0

      # semgrep/semgrep-action@v1 (deprecie) plantait sur les regles p/default
      # recentes TOUT EN PASSANT AU VERT (faux-vert). Remplace par le CLI a jour
      # en mode DIFF-AWARE : bloque les NOUVEAUX constats sans rejouer la dette
      # historique deja triee.
      - name: semgrep scan — jeu de règles p/default, diff-aware
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet semgrep
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Pas de baseline exploitable -> scan complet informatif (non bloquant)."
            semgrep scan --config p/default --metrics=off || true
          else
            echo "Baseline = $BASE_SHA (seuls les NOUVEAUX constats bloquent)."
            semgrep scan --config p/default --baseline-commit "$BASE_SHA" --error --metrics=off
          fi

  # ===========================================================================
  # 4 · PORTE BLOQUANTE — Tests automatises (unitaires + contrat d'API)
  # ===========================================================================
  tests-api:
    name: 4 · Tests automatisés — API (pytest)
    needs: [sast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Installer les dépendances
        run: |
          set -euo pipefail
          pip install -r api/requirements.txt
          pip install pytest pytest-cov httpx   # httpx : requis par le TestClient FastAPI

      - name: pytest — unitaires + contrat d'API
        working-directory: api
        run: pytest tests/ -v

  tests-dashboard:
    name: 4 · Tests automatisés — dashboard (jest)
    needs: [sast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Installer les dépendances (npm ci — versions verrouillées)
        working-directory: dashboard
        run: npm ci

      - name: jest — tests unitaires
        working-directory: dashboard
        run: npm test

  # ===========================================================================
  # 5 · Construction de l'image (Docker multi-etape)
  #     L'image reste LOCALE au run : elle est exportee en artefact pour la
  #     porte 6. Rien n'est publie tant que Trivy n'a pas donne son verdict.
  # ===========================================================================
  build:
    name: 5 · Construction de l'image (${{ matrix.app }})
    needs: [tests-api, tests-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: ./api
            image: menal-api
          - app: dashboard
            context: ./dashboard
            image: menal-dashboard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: docker build — image minimale, utilisateur non root
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${SHA}" "${CONTEXT}"

      - name: Exporter l'image pour la porte 6 (aucun registre)
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker save "${IMAGE}:${SHA}" -o image.tar
          ls -lh image.tar

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-${{ matrix.app }}
          path: image.tar
          retention-days: 1
          # Les couches d'une image sont deja compressees : recompresser coute
          # du temps pour ~0 octet gagne.
          compression-level: 0

  # ===========================================================================
  # 6 · PORTE BLOQUANTE — Analyse de vulnerabilites de l'image
  #     CRITICAL CORRIGEABLE => echec. `--ignore-unfixed` : on ne bloque pas la
  #     livraison sur une CVE sans correctif amont (rien a faire pour la lever).
  # ===========================================================================
  scan-image:
    name: 6 · Analyse de l'image (Trivy) (${{ matrix.app }})
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: menal-api
          - app: dashboard
            image: menal-dashboard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: image-${{ matrix.app }}

      - name: Recharger l'image construite à l'étape 5
        run: |
          set -euo pipefail
          docker load -i image.tar

      - name: trivy image — CRITICAL corrigeable (BLOQUANT)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: trivy image — rapport HIGH (informatif)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH
          ignore-unfixed: true

      # Boucle F6 : le scan alimente le SIEM (page /siem/vulnerabilities). Le
      # rapport est produit ici et charge dans BigQuery a l'etape 7 — la phase 1
      # n'a ainsi aucun acces cloud a justifier.
      - name: Rapport JSON pour le SIEM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          output: trivy-findings.json

      # Inventaire logiciel de l'image livree (tracabilite chaine d'appro).
      - name: SBOM CycloneDX de l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          scan-type: image
          format: cyclonedx
          exit-code: 0
          output: sbom.cdx.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scan-${{ matrix.app }}
          path: |
            trivy-findings.json
            sbom.cdx.json
          retention-days: 30

  # ===========================================================================
  # 7 · Publication au registre — PHASE 2 UNIQUEMENT (main)
  #     1 · Authentification federee (WIF) puis publication ; l'image est
  #     ensuite designee par son EMPREINTE sha256, jamais par un tag mutable.
  # ===========================================================================
  publish:
    name: 7 · Publication au registre (${{ matrix.app }})
    needs: [scan-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # federation WIF — aucune cle de compte de service
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: menal-api
          - app: dashboard
            image: menal-dashboard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: image-${{ matrix.app }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: scan-${{ matrix.app }}

      # ---- 1 · Authentification federee ------------------------------------
      - id: auth
        name: 1 · Authentification fédérée (WIF, sans clé)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Autoriser Docker auprès d'Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Publier l'image et résoudre son empreinte sha256
        id: push
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker load -i image.tar
          TAG="${ARTIFACT_REGISTRY}/${IMAGE}:${SHA}"
          docker tag "${IMAGE}:${SHA}" "$TAG"
          docker push "$TAG"
          # L'empreinte est relue depuis le registre : c'est elle, et non le tag,
          # qui sera deployee a l'etape 8.
          DIGEST=$(docker image inspect "$TAG" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^${ARTIFACT_REGISTRY}/${IMAGE}@sha256:" | head -1)
          echo "$DIGEST" > digest.txt
          echo "Publie par empreinte : $DIGEST"
          echo "### 7 · Publication — \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      # Le tag mutable `latest` ne sert JAMAIS au deploiement (etape 8 = empreinte
      # sha256). Il est maintenu parce que Terraform le resout
      # (data.google_artifact_registry_docker_image) a la creation initiale d'un
      # service Cloud Run : sans lui, un `apply` sur un environnement neuf echoue.
      - name: Maintenir le tag `latest` (requis par Terraform à la création)
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          gcloud artifacts docker tags add \
            "${ARTIFACT_REGISTRY}/${IMAGE}:${SHA}" \
            "${ARTIFACT_REGISTRY}/${IMAGE}:latest" --quiet || true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: digest-${{ matrix.app }}
          path: digest.txt
          retention-days: 30

      # Boucle F6 : les CVE de l'image publiee alimentent le SIEM.
      - name: Charger les CVE de l'image dans le SIEM (BigQuery)
        if: matrix.app == 'api'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pip install --quiet google-cloud-bigquery
          python scripts/load_cve_findings.py \
            --project "$PROJECT_ID" \
            --dataset "$BQ_DATASET" \
            --report trivy-findings.json \
            --image-digest "$SHA"

  # ===========================================================================
  # 8 · Deploiement et verification — PHASE 2 UNIQUEMENT (main)
  #     La revision Cloud Run est epinglee a l'EMPREINTE exacte scannee, puis
  #     sondee par le point d'entree public (DNS + TLS + LB + Cloud Armor).
  # ===========================================================================
  deploy:
    name: 8 · Déploiement et vérification (${{ matrix.app }})
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # federation WIF — aucune cle de compte de service
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            service_var: API_SERVICE_NAME
            domain: ${{ vars.LB_DOMAIN }}
            probe: /health
          - app: dashboard
            service_var: DASHBOARD_SERVICE_NAME
            domain: ${{ vars.DASH_DOMAIN }}
            probe: /login
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: digest-${{ matrix.app }}

      - name: Lire l'empreinte publiée à l'étape 7
        id: digest
        run: |
          set -euo pipefail
          REF=$(cat digest.txt)
          case "$REF" in
            *@sha256:*) ;;
            *) echo "Reference sans empreinte sha256 : '$REF'"; exit 1 ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Revision deployee sur l'empreinte : $REF"

      # ---- 1 · Authentification federee ------------------------------------
      - id: auth
        name: 1 · Authentification fédérée (WIF, sans clé)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Déployer la révision Cloud Run (par empreinte sha256)
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ vars[matrix.service_var] }}
          image: ${{ steps.digest.outputs.ref }}
          region: ${{ env.REGION }}

      - name: Sonder le service par le point d'entrée public (via le WAF)
        env:
          URL: https://${{ matrix.domain }}${{ matrix.probe }}
        run: |
          set -uo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   --retry 3 --retry-delay 5 "$URL" || echo "000")
          echo "HTTP $CODE  <-  $URL"
          case "$CODE" in
            200|30*) echo "OK : revision en service, joignable par le domaine public" ;;
            000)     echo "ECHEC : point d'entree injoignable (DNS / TLS / LB)"; exit 1 ;;
            *)       echo "ECHEC : statut inattendu $CODE"; exit 1 ;;
          esac

      # Retour arriere (diagramme, optionnel) : la commande exacte est rappelee
      # dans le run pour que l'administrateur n'ait pas a la chercher.
      - name: Retour arrière — commande à exécuter si la sonde a échoué
        if: failure()
        env:
          SERVICE: ${{ vars[matrix.service_var] }}
        run: |
          echo "::warning::Retour arriere (~12 s) : gcloud run services update-traffic $SERVICE --region $REGION --to-revisions=<revision-precedente>=100"
