name: CI - Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# STAGING est l environnement de reference du pipeline : c est lui que le
# CI-SEC-CD construit, scanne, deploie et teste en E2E. Dev sert aux essais
# manuels (terraform apply / hotfix locaux). Toutes les valeurs projet /
# registre / domaines viennent des variables GitHub du depot : basculer
# d environnement = changer les variables, pas ce fichier.
env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
  DASHBOARD_SERVICE_NAME: ${{ vars.DASHBOARD_SERVICE_NAME }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY_URL }}
  BQ_DATASET: ${{ vars.BQ_DATASET }}

permissions:
  contents: read
  id-token: write

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — gitleaks scanne le RANGE de commits du push
      # (before^..after) : avec le clone shallow par defaut, ces revisions
      # n existent pas localement et le scan echoue en "unknown revision".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Portes bloquantes : un secret detecte ou un finding SAST fait ECHOUER
      # le pipeline. Sans cela, ces scans etaient du theatre (continue-on-error).
      - name: Gitleaks - Secret Scanning
        uses: gitleaks/gitleaks-action@v2

      - name: Semgrep - SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-cov httpx   # httpx : requis par fastapi TestClient

      - name: Run API unit tests
        working-directory: api
        run: pytest tests/ -v

  build:
    name: Build & Deploy API
    needs: [security, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push Image
        id: build
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/menal-api:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./api
          docker push $IMAGE_TAG
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Porte bloquante : une CVE CRITICAL corrigeable fait echouer le build.
      # ignore-unfixed evite de bloquer sur des CVE sans correctif disponible
      # (sinon la porte serait desactivee a la premiere alerte non actionnable).
      - name: Trivy - CVE Scan (bloquant sur CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      # Rapport informatif HIGH : visible dans les journaux, non bloquant.
      - name: Trivy - rapport HIGH (informatif)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: 0
          severity: HIGH
          ignore-unfixed: true

      # Boucle F6 : le scan alimente le SIEM. Sans cette etape, cve_findings
      # restait vide et la page /siem/vulnerabilities du dashboard n affichait
      # rien — le pipeline scannait sans que personne ne voie le resultat.
      - name: Trivy - rapport JSON pour le SIEM
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          output: trivy-findings.json

      - name: Charger les CVE dans BigQuery
        if: always()
        run: |
          pip install --quiet google-cloud-bigquery
          python scripts/load_cve_findings.py \
            --project "${{ env.PROJECT_ID }}" \
            --dataset "${{ env.BQ_DATASET }}" \
            --report trivy-findings.json \
            --image-digest "${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ steps.build.outputs.image }}
          region: ${{ env.REGION }}

      - name: Tag as latest
        run: |
          gcloud artifacts docker tags add \
            ${{ steps.build.outputs.image }} \
            ${{ env.ARTIFACT_REGISTRY }}/menal-api:latest || true

      # DNS + certificat manages etant en place, le smoke test passe par le
      # domaine REEL (validation TLS incluse) : il couvre DNS, certificat,
      # LB, Cloud Armor et le service — pas seulement l IP.
      - name: Smoke Test (API via LB)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://${{ vars.LB_DOMAIN }}/health || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          case "$HTTP_STATUS" in
            200|302) echo "SUCCESS: service operationnel" ;;
            000)     echo "ECHEC: LB injoignable (DNS/SSL)"; exit 1 ;;
            *)       echo "ECHEC: statut inattendu $HTTP_STATUS"; exit 1 ;;
          esac

  dashboard:
    name: Build & Deploy Dashboard
    needs: [security, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push Image
        id: build
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/menal-dashboard:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./dashboard
          docker push $IMAGE_TAG
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Meme porte que pour l API : le dashboard est expose publiquement via
      # le LB, une CVE CRITICAL corrigeable dans son image bloque la livraison.
      - name: Trivy - CVE Scan (bloquant sur CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.DASHBOARD_SERVICE_NAME }}
          image: ${{ steps.build.outputs.image }}
          region: ${{ env.REGION }}

      - name: Tag as latest
        run: |
          gcloud artifacts docker tags add \
            ${{ steps.build.outputs.image }} \
            ${{ env.ARTIFACT_REGISTRY }}/menal-dashboard:latest || true

      - name: Smoke Test (dashboard via LB)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://${{ vars.DASH_DOMAIN }}/login || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          case "$HTTP_STATUS" in
            200|30*) echo "SUCCESS: dashboard operationnel" ;;
            *)       echo "ECHEC: statut inattendu $HTTP_STATUS"; exit 1 ;;
          esac

  e2e:
    name: E2E Tests
    needs: [build, dashboard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements-e2e.txt

      - name: Run E2E health & boundary tests
        run: |
          pytest tests/e2e/ -v -x -m "not slow and not gcp" \
            --timeout=30 \
            -o "junit_family=xunit2" \
            --junit-xml=e2e-results.xml
        env:
          E2E_API_URL: https://${{ vars.LB_DOMAIN }}
          # Le dashboard est en ingress LB-only : il faut le tester via son domaine
          # public (LB + Cloud Armor), pas via l URL .run.app (bloquee par design).
          E2E_DASHBOARD_URL: https://${{ vars.DASH_DOMAIN }}
          E2E_API_RUN_URL: ${{ vars.API_RUN_URL }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results.xml
          retention-days: 7
