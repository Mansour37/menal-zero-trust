name: CI - Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGION: europe-west1
  PROJECT_ID: menal-zero-trust-dev
  SERVICE_NAME: menal-api-dev
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev/menal-zero-trust-dev/menal-docker-dev

permissions:
  contents: read
  id-token: write

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks - Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Semgrep - SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
        continue-on-error: true

  build:
    name: Build & Push
    needs: security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push Image
        id: build
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/menal-api:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./api
          docker push $IMAGE_TAG
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Trivy - CVE Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ steps.build.outputs.image }}
          region: ${{ env.REGION }}

      - name: Tag as latest
        run: |
          gcloud artifacts docker tags add \
            ${{ steps.build.outputs.image }} \
            ${{ env.ARTIFACT_REGISTRY }}/menal-api:latest

      - name: Smoke Test
        run: |
          curl -s --max-time 10 \
            -H "Host: api.menal-sarl.com" \
            https://${{ vars.LB_IP_ADDRESS }}/health -k
