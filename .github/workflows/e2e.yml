name: E2E - Tests Playwright

on:
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: "URL du dashboard a tester"
        required: false
        default: ""
  workflow_run:
    workflows: ["CD - Deploy Dashboard"]
    types:
      - completed

jobs:
  e2e:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: cd dashboard && npm ci

      - name: Install Playwright browsers
        run: cd dashboard && npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: cd dashboard && npx playwright test
        env:
          DASHBOARD_URL: ${{ inputs.dashboard_url || vars.DASHBOARD_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7