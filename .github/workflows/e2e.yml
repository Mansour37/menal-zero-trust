name: E2E - Tests Integration

on:
  workflow_dispatch: {}

jobs:
  e2e-python:
    name: E2E Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements-e2e.txt

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v -x -m "not slow and not gcp" --timeout=30
        env:
          E2E_API_URL: https://${{ vars.LB_DOMAIN || 'api.menal-sarl.com' }}
          E2E_DASHBOARD_URL: ${{ vars.DASHBOARD_URL || '' }}
          E2E_API_RUN_URL: ${{ vars.API_RUN_URL || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results.xml
          retention-days: 7