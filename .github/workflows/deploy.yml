name: CD - Build & Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.ARTIFACT_REGISTRY_URL }}
  IMAGE_NAME: api

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.build.outputs.image_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}"
          DH_IMAGE="mo35ehab/menal-api"
          docker build \
            --tag $IMAGE_URL \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag $DH_IMAGE:${{ steps.tag.outputs.IMAGE_TAG }} \
            --tag $DH_IMAGE:latest \
            --file api/Dockerfile api/
          docker push $IMAGE_URL
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push $DH_IMAGE:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push $DH_IMAGE:latest
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: menal-api-dev
          image: ${{ needs.build.outputs.image_url }}
          region: ${{ vars.GCP_REGION }}
          flags: >-
            --service-account=sa-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ vars.CLOUD_SQL_CONNECTION_NAME }}
            --network=menal-vpc-${{ vars.ENVIRONMENT }}
            --subnet=subnet-private-${{ vars.ENVIRONMENT }}
            --vpc-egress=all-traffic
            --set-env-vars=ENVIRONMENT=${{ vars.ENVIRONMENT }},CLOUD_SQL_CONNECTION_NAME=${{ vars.CLOUD_SQL_CONNECTION_NAME }},DB_NAME=${{ vars.DB_NAME }},DB_USER=${{ vars.DB_USER }},GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            --set-secrets=DB_PASSWORD=db-password-dev:latest,JWT_SECRET=jwt-secret-dev:latest
            --ingress=internal-and-cloud-load-balancing
            --allow-unauthenticated
            --min-instances=1
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --port=8080

      - name: Verify deployment via Load Balancer
        run: |
          LB_URL="https://${{ vars.LB_DOMAIN }}"
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$LB_URL/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "Service operationnel : $LB_URL"
              exit 0
            fi
            echo "Tentative $i/12 - HTTP $HTTP_STATUS - attente 10s..."
            sleep 10
          done
          echo "Avertissement : verification LB en timeout (DNS peut-etre non configure)"
          exit 0