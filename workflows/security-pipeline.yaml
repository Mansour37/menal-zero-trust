main:
  params: [args]
  steps:
    - init:
        assign:
          - project: "menal-dev"
          - dataset: "menal_security_dev"
          - environment: "dev"

    - log_start:
        call: sys.log
        args:
          text: "Pipeline securite demarre - chargement access_logs depuis Cloud Run logs"
          severity: INFO

    - load_access_logs:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            configuration:
              query:
                query: >-
                  INSERT INTO `menal-dev.menal_security_dev.access_logs`
                  (timestamp, request_id, method, path, status_code,
                   ip_address, latency_ms, service)
                  SELECT
                    timestamp,
                    insertId AS request_id,
                    httpRequest.requestMethod AS method,
                    COALESCE(
                      REGEXP_EXTRACT(httpRequest.requestUrl, r'https?://[^/]+(/.*)'),
                      httpRequest.requestUrl
                    ) AS path,
                    CAST(httpRequest.status AS INT64) AS status_code,
                    httpRequest.remoteIp AS ip_address,
                    CAST(COALESCE(httpRequest.latency, 0) * 1000 AS INT64) AS latency_ms,
                    resource.labels.service_name AS service
                  FROM `menal-dev.menal_security_dev.run_googleapis_com_requests`
                  WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)
                    AND httpRequest.requestUrl IS NOT NULL
                    AND httpRequest.requestMethod IS NOT NULL
                    AND insertId NOT IN (
                      SELECT request_id
                      FROM `menal-dev.menal_security_dev.access_logs`
                      WHERE request_id IS NOT NULL
                        AND timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)
                    )
                useLegacySql: false
        result: load_job

    - log_access_logs_done:
        call: sys.log
        args:
          text: ${"access_logs charge - job " + load_job.jobReference.jobId}
          severity: INFO

    - aggregate_api_metrics:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            configuration:
              query:
                query: >-
                  INSERT INTO `menal-dev.menal_security_dev.api_metrics`
                  (hour, total_requests, success_count, error_count,
                   auth_failures, waf_blocks)
                  SELECT
                    TIMESTAMP_TRUNC(timestamp, HOUR) AS hour,
                    COUNT(*) AS total_requests,
                    COUNTIF(status_code BETWEEN 200 AND 299) AS success_count,
                    COUNTIF(status_code >= 400) AS error_count,
                    COUNTIF(status_code IN (401, 403)) AS auth_failures,
                    0 AS waf_blocks
                  FROM `menal-dev.menal_security_dev.access_logs`
                  WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)
                    AND timestamp < TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), HOUR)
                  GROUP BY 1
                useLegacySql: false
        result: metrics_job

    - detect_security_anomalies:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            configuration:
              query:
                query: >-
                  INSERT INTO `menal-dev.menal_security_dev.security_events`
                  (timestamp, event_type, severity, source_ip,
                   target_path, description, mitigated)
                  SELECT
                    timestamp,
                    CASE
                      WHEN status_code = 401 THEN 'auth_failure'
                      WHEN status_code = 403 THEN 'access_denied'
                      WHEN status_code = 429 THEN 'rate_limit_exceeded'
                      ELSE 'server_error'
                    END AS event_type,
                    CASE
                      WHEN status_code = 429 THEN 'HIGH'
                      WHEN status_code = 401 THEN 'MEDIUM'
                      ELSE 'LOW'
                    END AS severity,
                    ip_address AS source_ip,
                    path AS target_path,
                    CONCAT('HTTP ', CAST(status_code AS STRING), ' sur ', COALESCE(path, '/')) AS description,
                    true AS mitigated
                  FROM `menal-dev.menal_security_dev.access_logs`
                  WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)
                    AND status_code >= 400
                useLegacySql: false
        result: anomaly_job

    - log_end:
        call: sys.log
        args:
          text: ${"Pipeline securite termine - metrics=" + metrics_job.jobReference.jobId + " anomalies=" + anomaly_job.jobReference.jobId}
          severity: INFO

    - return_result:
        return:
          status: "success"
          load_job_id: ${load_job.jobReference.jobId}
          metrics_job_id: ${metrics_job.jobReference.jobId}
          anomaly_job_id: ${anomaly_job.jobReference.jobId}
